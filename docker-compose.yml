# ---------------------------------------------------------------------------
# RepoLens - two services, no database volume.
#
#   docker compose up --build        # http://localhost:3000
#
# Services:
#   api   FastAPI analysis engine. Results are temporary in-memory data.
#   web   Next.js UI, proxies /backend/* to the API internally.
#
# Configuration is read from .env (see .env.example). Keep the API at one worker;
# results and background tasks live only in that process.
# ---------------------------------------------------------------------------
name: repolens

services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_FILES: ${MAX_FILES:-4000}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-1048576}
      MAX_REPO_BYTES: ${MAX_REPO_BYTES:-104857600}
      MAX_ANALYSIS_SECONDS: ${MAX_ANALYSIS_SECONDS:-1800}
      ANALYSIS_WORKERS: ${ANALYSIS_WORKERS:-2}
      MAX_ACTIVE_ANALYSES_PER_SESSION: ${MAX_ACTIVE_ANALYSES_PER_SESSION:-2}
      MAX_ANALYSES_PER_HOUR: ${MAX_ANALYSES_PER_HOUR:-20}
      WINDOW_TTL_SECONDS: ${WINDOW_TTL_SECONDS:-1800}
      WINDOW_SWEEP_SECONDS: ${WINDOW_SWEEP_SECONDS:-30}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-2592000}
      STORE_SOURCE_SNIPPETS: ${STORE_SOURCE_SNIPPETS:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: /backend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      # Server-side proxy target for /backend/* (never exposed to the browser).
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_BASE: /backend
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
