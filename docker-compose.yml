# ---------------------------------------------------------------------------
# RepoLens - two services, no database volume.
#
#   docker compose up --build        # http://localhost:3000
#
# Services:
#   api   FastAPI analysis engine. Results are kept in memory (or in the
#         Postgres database named by DATABASE_URL, e.g. Neon when set).
#   web   Next.js UI, proxies /backend/* to the API internally.
#
# Secrets are read from the environment (see ../.env.example); nothing is
# baked into the images. Keep api at one worker: results live in that process.
# ---------------------------------------------------------------------------
name: repolens

services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MAX_FILES: ${MAX_FILES:-4000}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-1048576}
      MAX_REPO_BYTES: ${MAX_REPO_BYTES:-0}
      MAX_ANALYSIS_SECONDS: ${MAX_ANALYSIS_SECONDS:-1800}
      ANALYSIS_WORKERS: ${ANALYSIS_WORKERS:-2}
      MAX_STORED_RUNS: ${MAX_STORED_RUNS:-8}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: /backend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      # Server-side proxy target for /backend/* (never exposed to the browser).
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_BASE: /backend
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
