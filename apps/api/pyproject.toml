[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens-api"
version = "0.1.0"
description = "RepoLens FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "repolens-shared",
    "repolens-parser",
    "repolens-graph",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
