[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens-shared"
version = "0.1.0"
description = "Shared contracts, constants and errors for the RepoLens platform"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["repolens_shared*"]
