[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens-parser"
version = "0.1.0"
description = "Tree-sitter and AST based source code parser used by RepoLens"
requires-python = ">=3.11"
dependencies = [
    "repolens-shared",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["repolens_parser*"]
