[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens-embeddings"
version = "0.1.0"
description = "Embedding providers and vector search for RepoLens"
requires-python = ">=3.11"
dependencies = ["repolens-shared", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["repolens_embeddings*"]
