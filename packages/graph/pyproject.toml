[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens-graph"
version = "0.1.0"
description = "Dependency graph, architecture, workflow tracing, impact and quality analysis"
requires-python = ">=3.11"
dependencies = ["repolens-shared", "repolens-parser"]

[tool.setuptools.packages.find]
where = ["."]
include = ["repolens_graph*"]
